name: CI

on:
  push:
    branches: [main, develop/**, feat/**]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The package must work without the native extension. This job installs no
  # Rust at all, which is the only honest way to prove that the pure-Python
  # path still stands on its own.
  python-pure:
    name: python ${{ matrix.python }} (no native extension)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[web,importers,notify]" pytest

      - name: Confirm the native core really is absent
        # Guards against the extension arriving as a transitive dependency and
        # this job silently testing the same path as the others.
        run: |
          python - <<'PY'
          import importlib.util, sys
          if importlib.util.find_spec("aitrace_core") is not None:
              sys.exit("aitrace_core is installed; this job must run without it")
          from ai_trace_auditor.scanner import native
          assert not native.is_available(), "native.is_available() should be False"
          print("confirmed: pure-Python path")
          PY

      - name: Test
        run: pytest tests/ -q

  # With the extension installed, the suite runs twice: once using it, once
  # with it explicitly disabled. The second run is what stops the fallback
  # dispatch in scan.py from rotting unnoticed while everyone develops with
  # the fast path on.
  python-native:
    name: python ${{ matrix.python }} + native (${{ matrix.mode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
        mode: [native, forced-pure]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/aitrace-core

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[web,importers,notify]" pytest maturin

      - name: Build and install the native core
        working-directory: crates/aitrace-core
        run: maturin develop --release

      - name: Confirm the native core is present
        run: |
          python - <<'PY'
          import aitrace_core
          from ai_trace_auditor.scanner import native
          assert native.is_available()
          print("native core", aitrace_core.__version__, aitrace_core.build_info)
          PY

      - name: Test
        env:
          # In forced-pure mode the extension is installed but bypassed, so the
          # parity tests still run (they compare both implementations directly)
          # while the package itself exercises the Python scanners.
          AITRACE_NO_NATIVE: ${{ matrix.mode == 'forced-pure' && '1' || '' }}
        run: pytest tests/ -q

  rust:
    name: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # pyo3 needs an interpreter at least as new as the abi3-py311
          # feature it is built against.
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/aitrace-core

      - name: Format
        working-directory: crates/aitrace-core
        run: cargo fmt --check

      - name: Clippy
        working-directory: crates/aitrace-core
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        working-directory: crates/aitrace-core
        run: cargo test

  # Cloning four large repositories is too slow for every pull request, but a
  # benchmark nobody re-runs is a number nobody can trust. Weekly, plus on
  # demand.
  benchmark:
    name: benchmark and parity
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . maturin

      - name: Build the native core
        working-directory: crates/aitrace-core
        run: maturin develop --release

      - name: Fetch corpora
        run: benchmarks/fetch_corpora.sh

      - name: Benchmark both implementations
        run: |
          AITRACE_NO_NATIVE=1 python benchmarks/bench_scan.py \
            --json /tmp/baseline.json benchmarks/corpora/*
          python benchmarks/bench_scan.py \
            --json /tmp/native.json benchmarks/corpora/*

      - name: Report the speedup
        run: |
          python - <<'PY'
          import json
          base = json.load(open("/tmp/baseline.json"))
          native = json.load(open("/tmp/native.json"))

          def best(doc, corpus, phase):
              for result in doc["results"]:
                  if result["corpus"].endswith(corpus):
                      for p in result["phases"]:
                          if p["name"] == phase:
                              return min(p["times_s"])
              return None

          total_base = total_native = 0.0
          for corpus in ("dify", "langchain", "haystack", "crewai"):
              b = best(base, corpus, "scan_codebase")
              n = best(native, corpus, "scan_codebase")
              if b and n:
                  total_base += b
                  total_native += n
                  print(f"{corpus:<12} {b*1000:8.0f}ms -> {n*1000:7.0f}ms  {b/n:5.1f}x")
          print(f"{'TOTAL':<12} {total_base*1000:8.0f}ms -> {total_native*1000:7.0f}ms  "
                f"{total_base/total_native:5.1f}x")
          PY

      - name: Differential parity check
        # Reports where the two implementations disagree. Divergences are
        # expected and documented in native.KNOWN_DIVERGENCES; this surfaces
        # them so a new, undocumented one gets noticed.
        run: python benchmarks/parity_check.py benchmarks/corpora/*
