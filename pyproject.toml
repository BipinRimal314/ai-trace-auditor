[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-trace-auditor"
version = "0.18.0"
description = "AI compliance auditor: EU AI Act, NIST AI RMF, ISO 42001, SOC 2. Every requirement verified against primary legal text with exact clause citations."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    { name = "Bipin Rimal", email = "bipinrimal314@gmail.com" },
]
keywords = ["ai", "compliance", "traceability", "eu-ai-act", "nist", "llm", "observability", "audit", "gdpr", "annex-iv", "data-flow", "mermaid"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "pydantic>=2.0",
    "typer>=0.12",
    "rich>=13.0",
    "jinja2>=3.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Native scanning core. Purely an accelerator: without it the pure-Python
# scanners are used and everything still works. See docs/native-core-2026-07-25.md.
#
# RELEASE ORDER MATTERS. `aitrace-core` is published by
# .github/workflows/wheels.yml, triggered by an `aitrace-core-v*` tag. That tag
# must be pushed and the wheels must land on PyPI *before* any release of this
# package that carries this extra — otherwise `pip install ai-trace-auditor[fast]`
# fails with "no matching distribution" for everyone who tries it.
fast = ["aitrace-core>=0.1.0"]
pdf = ["weasyprint>=62.0", "markdown>=3.5"]
langfuse = ["httpx>=0.27"]
arize = ["httpx>=0.27"]
importers = ["httpx>=0.27"]
mcp = ["mcp>=1.0"]
notify = ["httpx>=0.27"]
web = ["fastapi>=0.100", "uvicorn>=0.20", "python-multipart>=0.0.6"]
# "verify" installs the primary-source verification stack used by CI to prove
# every requirement YAML's exact_quote field appears verbatim in the pinned
# source document. Not a runtime requirement for the library itself.
verify = ["pdfplumber>=0.11.0"]

[project.scripts]
aitrace = "ai_trace_auditor.cli:app"
aitrace-mcp = "ai_trace_auditor.mcp_server:main"
aitrace-web = "ai_trace_auditor.web.server:main"

[project.urls]
Homepage = "https://github.com/BipinRimal314/ai-trace-auditor"
Repository = "https://github.com/BipinRimal314/ai-trace-auditor"
Issues = "https://github.com/BipinRimal314/ai-trace-auditor/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_trace_auditor"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
